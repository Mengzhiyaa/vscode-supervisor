name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSITRON_ROOT: .positron-upstream
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout watched Positron contracts
        uses: actions/checkout@v5
        with:
          repository: posit-dev/positron
          path: .positron-upstream
          sparse-checkout: |
            /src/positron-dts/positron.d.ts
            /src/vs/workbench/services/languageRuntime/common/languageRuntimeService.ts
            /src/vs/workbench/api/browser/positron/mainThreadLanguageRuntime.ts
            /positron/comms/data_explorer-backend-openrpc.json
            /positron/comms/data_explorer-frontend-openrpc.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test binary installer
        run: npm run test:binaries

      - name: Verify generated contracts
        run: npm run verify:contracts

      - name: Run extension host tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: webview

      - name: Run webview integration tests
        run: npm run test:integration
        working-directory: webview

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            target_os: linux
            target_arch: x64
          - runner: ubuntu-latest
            target: linux-arm64
            target_os: linux
            target_arch: arm64
          - runner: macos-15
            target: darwin-x64
            target_os: darwin
            target_arch: x64
          - runner: macos-latest
            target: darwin-arm64
            target_os: darwin
            target_arch: arm64
          - runner: windows-latest
            target: win32-x64
            target_os: windows
            target_arch: x64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install target binaries
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: npm run install:binaries -- --retry 3

      - name: Package target VSIX
        shell: bash
        run: |
          mkdir -p artifacts
          npx vsce package --no-dependencies --target "${{ matrix.target }}" --out "artifacts/vscode-supervisor-${{ matrix.target }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vscode-supervisor-${{ matrix.target }}
          path: artifacts/*.vsix
          retention-days: 1

  publish-ci-prerelease:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vscode-supervisor-ci-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NAME: CI Pre-release
      RELEASE_TAG: ci-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Refresh CI pre-release
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.vsix)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No VSIX artifacts found"
            exit 1
          fi

          branch_ref="${GITHUB_REF_NAME//\//%2F}"
          branch_head="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_ref}" --jq '.object.sha')"
          if [ "${branch_head}" != "${GITHUB_SHA}" ]; then
            echo "Skip prerelease publish because ${GITHUB_REF_NAME} advanced to ${branch_head}"
            exit 0
          fi

          cat > prerelease-notes.md <<EOF
          Automated CI pre-release for \`${GITHUB_REF_NAME}\`.

          Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          EOF

          gh release delete "${RELEASE_TAG}" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh api \
            --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            >/dev/null 2>&1 || true

          gh release create "${RELEASE_TAG}" "${files[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes-file prerelease-notes.md \
            --prerelease
